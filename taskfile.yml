version: '3'

vars:
  BUILDBOT: https://buildbot.libretro.com/nightly/android/latest
  CORES_DIR: app/src/main/jniLibs
  KITCHEN_SRC: ../cannoli-kitchen
  KITCHEN_DEST: app/src/main/assets/kitchen
  PKG: dev.cannoli.scorza
  # Pass DEVICE=<serial> when more than one is attached. `task devices` lists them.
  ADB: adb {{if .DEVICE}}-s {{.DEVICE}} {{end}}

tasks:
  cores:
    # CORES below is generated from credits.json by scripts/sync_credits.py.
    desc: Fetch bundled libretro cores for arm64-v8a and armeabi-v7a
    vars:
      CORES:
        - gambatte
        - genesis_plus_gx
        - handy
        - mednafen_ngp
        - mednafen_pce_fast
        - mednafen_vb
        - mednafen_wswan
        - mgba
        - nestopia
        - pcsx_rearmed
        - pokemini
        - prosystem
        - snes9x
        - stella
        - swanstation
    cmds:
      - mkdir -p {{.CORES_DIR}}/arm64-v8a {{.CORES_DIR}}/armeabi-v7a
      - for:
          var: CORES
        cmd: |
          for arch in arm64-v8a armeabi-v7a; do
            zip="{{.ITEM}}_libretro_android.so.zip"
            dest="{{.CORES_DIR}}/${arch}"
            if [ -f "${dest}/{{.ITEM}}_libretro_android.so" ]; then
              echo "SKIP ${arch}/{{.ITEM}}"
              continue
            fi
            echo "FETCH ${arch}/{{.ITEM}}"
            curl -sfL "{{.BUILDBOT}}/${arch}/${zip}" -o "/tmp/${zip}" && \
              unzip -o "/tmp/${zip}" -d "${dest}" && \
              rm "/tmp/${zip}" || \
              echo "FAIL ${arch}/{{.ITEM}}"
          done

  cores:clean:
    desc: Remove all downloaded cores
    cmds:
      - rm -rf {{.CORES_DIR}}

  test:
    desc: Run the JVM unit tests
    cmds:
      - ./gradlew :app:testDebugUnitTest :cannoli-igm:testDebugUnitTest

  install:
    desc: Build and install the debug APK
    cmds:
      - ./gradlew :app:assembleDebug
      - '{{.ADB}}install -r app/build/outputs/apk/debug/app-debug.apk'

  profile:
    desc: Build, install and AOT compile the profiling APK, the only build launch timings are real on
    cmds:
      - ./gradlew :app:assembleProfiling
      - '{{.ADB}}install -r app/build/outputs/apk/profiling/app-profiling.apk'
      # Installing resets dexopt; the run lets ProfileInstaller write, the compile applies it.
      - '{{.ADB}}logcat -c'
      - '{{.ADB}}shell am start -n {{.PKG}}/.MainActivity'
      - |
        for i in $(seq 1 20); do
          n=$({{.ADB}}shell "logcat -d 2>/dev/null | grep -c ProfileInstaller")
          [ "$n" != "0" ] && break
          sleep 3
        done
      - '{{.ADB}}shell cmd package compile -m speed-profile -f {{.PKG}}'
      - task: dexopt

  dexopt:
    desc: Show how the installed app is compiled; anything but speed-profile makes launch timings meaningless
    cmds:
      - '{{.ADB}}shell "dumpsys package {{.PKG}} | grep -A6 \"Dexopt state\"" | grep "status=" || true'

  launch:timings:
    desc: Launch timings for recent game launches, read out of the events buffer
    cmds:
      # The events buffer holds over an hour, so play first and read after.
      - |
        {{.ADB}}shell logcat -b events -d -v time \
          | grep -E 'am_proc_bound.*retroarch|wm_on_create_called.*(Ricotta|RetroActivity)|wm_activity_launch_time|wm_on_stop_called.*MainActivity' \
          | tail -24

  controllers:
    desc: Controller table for an attached device, showing pads whose real evdev node the vendor layer has hidden
    # Prompts for a device when several are attached, so it needs a tty.
    interactive: true
    cmds:
      - scripts/controller-table.sh {{.DEVICE}}

  credits:sync:
    desc: Sync credits.json to CreditsData.kt, taskfile.yml, and release.yml
    cmds:
      - python3 scripts/sync_credits.py

  credits:contributors:
    desc: Refresh localization contributors in credits.json from Crowdin, then resync
    cmds:
      - python3 scripts/sync_crowdin_contributors.py
      - python3 scripts/sync_credits.py

  kitchen:
    desc: Build cannoli-kitchen and copy dist into app assets
    dir: '{{.KITCHEN_SRC}}'
    cmds:
      # build-only skips vue-tsc, which cannot run under bun (Volar .vue resolution breaks); run `bun run type-check` under Node for the type gate
      - bun run build-only
      - rm -rf {{.USER_WORKING_DIR}}/{{.KITCHEN_DEST}}/*
      - cp -R dist/. {{.USER_WORKING_DIR}}/{{.KITCHEN_DEST}}/
