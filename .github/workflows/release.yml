name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (e.g. 1.0.0)
        required: true
      branch:
        description: Branch to build from
        required: true
        default: main
      message:
        description: Release notes
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true

env:
  BUILDBOT: https://buildbot.libretro.com/nightly/android/latest
  # Generated from credits.json by scripts/sync_credits.py.
  CORES: >-
    gambatte genesis_plus_gx handy mednafen_ngp mednafen_pce_fast mednafen_vb
    mednafen_wswan mgba nestopia pcsx_rearmed pokemini prosystem snes9x stella
    swanstation

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Download libretro cores
        run: |
          for arch in arm64-v8a armeabi-v7a; do
            dir="app/src/main/jniLibs/${arch}"
            mkdir -p "$dir"
            for core in $CORES; do
              name="${core}_libretro_android.so"
              echo "Downloading ${arch}/${name}"
              curl -sL "${BUILDBOT}/${arch}/${name}.zip" -o /tmp/core.zip
              unzip -o -q /tmp/core.zip -d "$dir"
              rm /tmp/core.zip
            done
          done

      # Fetched here rather than read from the tree so a release ships info that matches the cores
      # downloaded above, from the same upstream at the same moment. This replaced a weekly sync
      # that opened a PR against the committed copy: that only ever reviewed the tree, never what
      # shipped, so it could not catch an upstream core changing its database field between syncs.
      #
      # The committed copy stays as the offline fallback that dev builds and the test suite read.
      # Nothing refreshes it now, so it is a seed rather than a mirror, and the check below is what
      # holds the line at release.
      - name: Refresh core info
        run: |
          git clone --depth=1 https://github.com/libretro/libretro-super /tmp/libretro-super
          missing=0
          while read -r core; do
            case "$core" in ''|\#*) continue ;; esac
            src="/tmp/libretro-super/dist/info/$core.info"
            if [ -f "$src" ]; then
              cp "$src" app/src/main/assets/core_info/
            else
              echo "::error::curated core '$core' has no info file upstream, it may have been renamed"
              missing=$((missing + 1))
            fi
          done < scripts/curated-cores.txt
          if [ "$missing" -gt 0 ]; then
            echo "$missing curated cores are missing upstream, refusing to package a catalogue with holes"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - uses: oven-sh/setup-bun@v2

      - name: Build Kitchen frontend
        run: |
          git clone https://github.com/CannoliHQ/kitchen.git /tmp/kitchen
          (cd /tmp/kitchen && bun install --frozen-lockfile && bun run build)
          mkdir -p app/src/main/assets/kitchen
          cp -r /tmp/kitchen/dist/* app/src/main/assets/kitchen/

      - name: Fetch RetroArch autoconfig cfgs
        run: ./scripts/fetch-autoconfig.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Compute version code and patch build.gradle.kts
        run: |
          VERSION="${{ inputs.version }}"
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [[ "$VERSION" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            PRE="${SUFFIX##*.}"
            [[ "$PRE" =~ ^[0-9]+$ ]] || PRE=1
            (( PRE > 98 )) && PRE=98
          else
            PRE=99
          fi
          VERSION_CODE=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 10000 + ${PATCH:-0} * 100 + PRE ))
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts
          echo "versionCode=$VERSION_CODE, versionName=${{ inputs.version }}"

      # The catalogue invariants run against the info just fetched, which is what will ship. The
      # weekly sync only ever reviewed the committed copy, so it could not catch an upstream core
      # changing its database field between syncs and breaking platform mapping at release.
      - name: Verify the fetched catalogue
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :app:testDebugUnitTest --tests "dev.cannoli.scorza.config.*"

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Get version info
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=cannoli-${{ inputs.version }}-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ inputs.message }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ inputs.branch }}
          files: app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
