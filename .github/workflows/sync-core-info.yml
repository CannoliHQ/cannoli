name: Sync Core Info

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}

      - name: Fetch upstream info files
        run: |
          git clone --depth=1 https://github.com/libretro/libretro-super /tmp/libretro-super
          rm -rf app/src/main/assets/core_info
          mkdir -p app/src/main/assets/core_info
          missing=0
          while read -r core; do
            case "$core" in ''|\#*) continue ;; esac
            src="/tmp/libretro-super/dist/info/$core.info"
            if [ -f "$src" ]; then
              cp "$src" app/src/main/assets/core_info/
            else
              echo "::error::curated core '$core' has no info file upstream, it may have been renamed"
              missing=$((missing + 1))
            fi
          done < scripts/curated-cores.txt
          if [ "$missing" -gt 0 ]; then
            echo "$missing curated cores are missing upstream, refusing to sync a catalogue with holes"
            exit 1
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- app/src/main/assets/core_info; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ADDED=$(git diff --name-status -- app/src/main/assets/core_info | grep -c '^A' || true)
            REMOVED=$(git diff --name-status -- app/src/main/assets/core_info | grep -c '^D' || true)
            MODIFIED=$(git diff --name-status -- app/src/main/assets/core_info | grep -c '^M' || true)
            echo "added=$ADDED" >> "$GITHUB_OUTPUT"
            echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
            echo "modified=$MODIFIED" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}
          branch: sync/core-info
          commit-message: "chore: sync core info files from libretro-super"
          title: "chore: sync core info files from libretro-super"
          body: |
            Automated sync of `app/src/main/assets/core_info/` from [libretro/libretro-super](https://github.com/libretro/libretro-super/tree/master/dist/info).

            - Added: ${{ steps.diff.outputs.added }}
            - Removed: ${{ steps.diff.outputs.removed }}
            - Modified: ${{ steps.diff.outputs.modified }}

            Review the diff to confirm no core we rely on changed its `database` field in a way that
            breaks `CoreInfoRepository.tagToDatabases`. Only cores listed in `scripts/curated-cores.txt`
            are copied, so an added or removed file here means that list changed, not upstream.
          delete-branch: true
